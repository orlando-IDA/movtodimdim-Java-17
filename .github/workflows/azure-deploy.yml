name: DimDim - Build e deploy Azure - RM 561584

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e testar
        run: mvn -B clean verify
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      - name: Guardar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: dimdim-jar
          path: target/dimdim-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar aplicativo
        uses: actions/download-artifact@v4
        with:
          name: dimdim-jar
          path: artifact

      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: movtodimdim-rm561584
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifact/dimdim-0.0.1-SNAPSHOT.jar
